<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click to reveal token</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: #fa0;
            font-family: Arial, sans-serif;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
            background-color: #fa0;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.15 linear;
        }

        button:hover {
            padding: 100px;
        }
    </style>
</head>
<body>
    <button id="playButton">Click to Show Token</button>

    <audio id="rickrollAudio" src="/Sounds/Rick-Roll-Sound-Effect.mp3" loop></audio>

    <script>
        document.getElementById('playButton').addEventListener('click', function() {
            var audio = document.getElementById('rickrollAudio');
            audio.play().catch(function(error) {
                console.error('Audio playback failed:', error);
            });
        });
    </script>
</body>
</html>
