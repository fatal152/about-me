<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click to reveal token</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: #fa0;
            font-family: Arial, sans-serif;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
            background-color: #fa0;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: padding 0.3s ease;
        }

        button:hover {
            padding: 100px;
        }

        #youtubeVideo {
            display: none;
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>
    <button id="playButton">Click to Show Token</button>

    <iframe id="youtubeVideo" src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtubeVideo', {
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('playButton').addEventListener('click', function() {
                player.playVideo();
                document.getElementById('playButton').style.display = 'none'; // Hide the button
                document.getElementById('youtubeVideo').style.display = 'block';
                document.getElementById('youtubeVideo').style.width = '560px';
                document.getElementById('youtubeVideo').style.height = '315px';
            });
        }
    </script>
</body>
</html>
