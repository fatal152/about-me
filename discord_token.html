<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click to Reveal Token</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        h1 {
            position: absolute;
            top: 200px;
            left: 30%;
            font-size: 2rem;
            color: #fa0;
            animation: glitch 1s infinite;
            z-index: 1000;
        }

        @keyframes glitch {
            0% {
                text-shadow: 2px 2px #f00, -2px -2px #00f;
            }

            25% {
                text-shadow: -2px -2px #0f0, 2px 2px #f0f;
            }

            50% {
                text-shadow: 2px -2px #ff0, -2px 2px #0ff;
            }

            75% {
                text-shadow: -2px 2px #f00, 2px -2px #00f;
            }

            100% {
                text-shadow: 2px 2px #fa0, -2px -2px #00fa;
            }
        }

        button {
            font-size: 30px;
            padding: 20px 40px;
            background: linear-gradient(45deg, #fa0, #ff0, #f00);
            background-size: 200% 200%;
            color: #000;
            border: 3px solid #fff;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: gradientShift 3s infinite, shake 0.5s infinite;
            position: relative;
            z-index: 1000;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            50% {
                transform: translateX(10px);
            }

            75% {
                transform: translateX(-5px);
            }
        }

        button:hover {
            transform: scale(1.5) rotate(180deg);
            background: linear-gradient(45deg, #0ff, #f0f, #ff0);
            background-size: 300% 300%;
        }

        #youtubeVideo {
            display: none;
            width: 0;
            height: 0;
            opacity: 0;
            margin-top: 20px;
            border: 10px solid #fa0;
            box-shadow: 0 0 20px #f00, 0 0 40px #0ff, 0 0 60px #ff0;
            transition: opacity 2s ease, width 1s ease, height 1s ease, box-shadow 2s ease;
        }

        #hiddenMessage {
            display: none;
            margin-top: 20px;
            font-size: 20px;
            color: #0f0;
            animation: revealText 2s forwards, textPulse 2s infinite;
        }

        @keyframes revealText {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes textPulse {
            0%,
            100% {
                text-shadow: 0 0 5px #fa0, 0 0 10px #f0f;
            }

            50% {
                text-shadow: 0 0 20px #0ff, 0 0 40px #ff0;
            }
        }

        #customCursor {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #ff0;
            border-radius: 50%;
            pointer-events: none;
            animation: cursorPulse 2s infinite alternate;
        }

        @keyframes cursorPulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 10px #f00, 0 0 20px #fa0;
            }

            100% {
                transform: scale(1.5);
                box-shadow: 0 0 20px #0ff, 0 0 40px #ff0;
            }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff0;
            top: -10px;
            border-radius: 50%;
            animation: fall 5s infinite linear;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes confettiRain {
            0%,
            100% {
                transform: translateY(-100vh);
            }

            50% {
                transform: translateY(100vh);
            }
        }
    </style>
</head>

<body>
    <div id="customCursor"></div>
    <h1>Click the Button to Reveal the Token</h1>
    <button id="playButton">Show Token</button>

    <iframe id="youtubeVideo"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1&autoplay=1&modestbranding=1&controls=0"
        frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>

    <div id="hiddenMessage">You just got Rickrolled! 😆</div>

    <script>
        document.body.addEventListener('mousemove', function (e) {
            var cursor = document.getElementById('customCursor');
            cursor.style.top = e.clientY + 'px';
            cursor.style.left = e.clientX + 'px';
        });

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtubeVideo', {
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('playButton').addEventListener('click', function () {
                player.playVideo();
                document.getElementById('playButton').style.display = 'none';
                document.getElementById('youtubeVideo').style.display = 'block';
                document.getElementById('youtubeVideo').style.width = '560px';
                document.getElementById('youtubeVideo').style.height = '315px';
                document.getElementById('youtubeVideo').style.opacity = 1;
                triggerConfetti();
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.ENDED) {
                document.getElementById('hiddenMessage').style.display = 'block';
            }
        }

        function triggerConfetti() {
            for (var i = 0; i < 100; i++) {
                var confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                confetti.style.backgroundColor = getRandomColor();
                document.body.appendChild(confetti);
            }
        }

        function getRandomColor() {
            var letters = '0123456789ABCDEF';
            var color = '#';
            for (var i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }
    </script>
</body>

</html>
